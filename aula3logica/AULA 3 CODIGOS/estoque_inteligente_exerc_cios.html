<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP Presencial 03 - Exercícios</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
      color: #000000;
    }
    
    .font-mono {
      font-family: 'Space Mono', monospace;
    }

    .card {
      border: 2px solid #000000;
      transition: all 0.2s ease-in-out;
    }
    
    .card:hover {
      background-color: #000000;
      color: #ffffff;
      transform: translateY(-4px);
      box-shadow: 4px 4px 0px #000000;
    }
    
    .card:hover .icon-arrow {
      color: #ffffff;
      transform: translateX(4px);
    }
    
    .btn-back {
      border: 2px solid #000000;
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .btn-back:hover {
      background-color: #000000;
      color: #ffffff;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body class="min-h-screen p-8 md:p-16">

  <main id="main-menu" class="max-w-6xl mx-auto">
    <header class="mb-16 border-b-4 border-black pb-8">
      <p class="text-sm font-bold uppercase tracking-widest mb-2">Lógica de Programação • UC 4</p>
      <h1 class="text-4xl md:text-6xl font-extrabold leading-tight">Estoque Inteligente</h1>
      <p class="text-xl md:text-2xl mt-4 font-light">Plataforma de Exercícios e Gabaritos</p>
    </header>

    <!-- Seção 1 -->
    <section class="mb-16">
      <h2 class="text-3xl font-bold mb-6 flex items-center">
        <span class="bg-black text-white px-3 py-1 mr-4">01</span> Oficina de Vetores
      </h2>
      <div id="grid-part-1" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cards injetados via JS -->
      </div>
    </section>

    <!-- Seção 2 -->
    <section class="mb-16">
      <h2 class="text-3xl font-bold mb-6 flex items-center">
        <span class="bg-black text-white px-3 py-1 mr-4">02</span> Oficina de Funções
      </h2>
      <div id="grid-part-2" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cards injetados via JS -->
      </div>
    </section>

    <!-- Seção 3 -->
    <section class="mb-16">
      <h2 class="text-3xl font-bold mb-6 flex items-center">
        <span class="bg-black text-white px-3 py-1 mr-4">03</span> Atividades Avaliativas (Gabaritos)
      </h2>
      <div id="grid-part-3" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
        <!-- Cards injetados via JS -->
      </div>
    </section>
  </main>

  <main id="details-view" class="max-w-5xl mx-auto hidden">
    <div class="mb-8 flex items-center justify-between">
      <button onclick="goBack()" class="btn-back px-6 py-3 flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Menu
      </button>
      <span id="detail-part-badge" class="font-bold text-sm tracking-wider uppercase border border-black px-4 py-1"></span>
    </div>

    <h1 id="detail-title" class="text-4xl md:text-5xl font-extrabold mb-8"></h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
      <div class="col-span-1 md:col-span-2">
        <h3 class="text-xl font-bold mb-2 border-b-2 border-black inline-block">Descrição</h3>
        <p id="detail-desc" class="text-lg leading-relaxed mb-6"></p>
      </div>
      
      <div class="col-span-1 bg-gray-50 border-2 border-black p-6">
        <h3 class="text-xl font-bold mb-2 flex items-center gap-2"><i class="fa-solid fa-lightbulb"></i> Dica</h3>
        <p id="detail-hint" class="text-base italic"></p>
      </div>
    </div>

    <div>
      <div class="bg-black text-white p-4 flex justify-between items-center">
        <h3 class="font-bold font-mono text-lg"><i class="fa-solid fa-code"></i> Arquivo: <span id="detail-filename"></span>.por</h3>
      </div>
      <div class="border-2 border-t-0 border-black bg-gray-50 p-6 overflow-x-auto">
        <pre><code id="detail-code" class="font-mono text-[15px] leading-loose text-gray-800">Carregando código...</code></pre>
      </div>
    </div>
  </main>

  <script>
    // Base de dados contendo todos os exercícios com os nomes de arquivos EXATOS
    const exercises = [
      // PARTE 1
      {
        part: 1,
        title: "Desafio 1: O Primeiro Lote",
        file: "01_primeiro_lote",
        description: "Declare um vetor de inteiros com 5 posições. Preencha manualmente com as quantidades de 5 produtos e, em seguida, crie um laço 'para' que exiba todos os valores.",
        hint: "Lembre-se que o índice do vetor em Portugol começa em 0 e vai até o 4."
      },
      {
        part: 1,
        title: "Desafio 2: Registro de Nomes",
        file: "02_registro_de_nomes",
        description: "Declare um vetor de texto para armazenar o nome de 3 produtos, lidos via teclado. Imprima os nomes na ordem inversa (do último para o primeiro).",
        hint: "Para imprimir invertido, o laço 'para' deve começar no índice 2 e ir diminuindo (passo -1) até 0."
      },
      {
        part: 1,
        title: "Desafio 3: Somatório do Estoque",
        file: "03_somatorio_do_estoque",
        description: "Crie um vetor com 5 quantidades. Faça um laço de repetição que percorra o vetor e some todas as quantidades em uma variável total.",
        hint: "Declare a variável acumuladora (ex: total = 0) antes do laço. Dentro do laço faça: total = total + vetor[i]."
      },
      {
        part: 1,
        title: "Desafio 4: A Busca Simples",
        file: "04_busca_simples",
        description: "Crie um vetor com 5 códigos predefinidos. Peça ao usuário um código. Percorra o vetor e se encontrar, avise que foi encontrado.",
        hint: "Use uma estrutura condicional 'se (vetor[i] == codigo_buscado)' dentro do laço."
      },
      {
        part: 1,
        title: "Desafio 5: Onde está o produto?",
        file: "05_posicao_do_produto",
        description: "Melhore o desafio da busca simples, armazenando a posição (índice) onde o item foi encontrado em uma variável e exibindo-a no final.",
        hint: "Inicialize a variável de posição com -1 antes do laço. Se ela terminar valendo -1, significa que o produto não existe."
      },
      {
        part: 1,
        title: "Desafio 6: Estoque Crítico",
        file: "06_estoque_critico",
        description: "Crie um vetor de quantidades. Percorra-o e imprima os índices e valores apenas dos produtos com quantidade menor que 5 (filtro).",
        hint: "Combine o laço 'para' com a verificação lógica 'se (vetor[i] < 5)'."
      },
      {
        part: 1,
        title: "Desafio 7: O Produto Mais Cheio",
        file: "07_maior_valor",
        description: "Percorra o vetor de quantidades para descobrir e exibir qual é o maior valor numérico armazenado.",
        hint: "Crie a variável 'maior' iniciando com vetor[0] e vá substituindo sempre que encontrar alguém superior."
      },
      {
        part: 1,
        title: "Desafio 8: O Produto Quase Zerado",
        file: "08_menor_valor",
        description: "Assim como no desafio anterior, crie a lógica para encontrar a menor quantidade presente no vetor.",
        hint: "Crie a variável 'menor' recebendo vetor[0] e substitua sempre que o laço encontrar um valor inferior a ela."
      },
      {
        part: 1,
        title: "Desafio 9: Vetores Paralelos",
        file: "09_vetores_paralelos",
        description: "Crie um vetor de nomes e outro de preços. Preencha-os e use um único laço para exibir os dados associados lado a lado.",
        hint: "O segredo dos vetores paralelos é usar a mesma variável de controle (ex: i) para acessar ambos no mesmo momento."
      },
      {
        part: 1,
        title: "Desafio 10: Reajuste de Preços",
        file: "10_reajuste_de_precos",
        description: "Aplique um aumento de 10% a todos os preços salvos no vetor usando um laço de repetição, salvando o novo valor de volta no vetor.",
        hint: "A instrução será parecida com: precos[i] = precos[i] * 1.10."
      },

      // PARTE 2
      {
        part: 2,
        title: "Desafio 11: Cabeçalho do Sistema",
        file: "11_cabecalho_do_sistema",
        description: "Crie uma função sem retorno ('vazio') que receba um texto por parâmetro e imprima-o formatado com bordas.",
        hint: "Basta colocar os comandos 'escreva' dentro do bloco da função. Chame-a passando uma string."
      },
      {
        part: 2,
        title: "Desafio 12: A Regra de Negócio",
        file: "12_calculo_com_retorno",
        description: "Crie a função calcular_valor_total() recebendo a quantidade e o preço. Ela deve multiplicar e retornar o resultado para o programa.",
        hint: "A função precisa ser do tipo 'real' e usar o comando 'retorne (quantidade * preco)'."
      },
      {
        part: 2,
        title: "Desafio 13: Validador de Estoque",
        file: "13_validador_de_estoque",
        description: "Crie uma função que receba uma quantidade e retorne um valor lógico (verdadeiro/falso) informando se há disponibilidade no estoque.",
        hint: "Retorne verdadeiro se a variável for maior que zero."
      },
      {
        part: 2,
        title: "Desafio 14: Formatador de Relatório",
        file: "14_formatador_de_relatorio",
        description: "Função que recebe código, nome e quantidade por parâmetros, formata isso numa única cadeia de texto (string) e retorna o resultado.",
        hint: "Use o sinal de mais (+) para concatenar textos fixos com os valores das variáveis passadas."
      },
      {
        part: 2,
        title: "Desafio 15: Isolando a Busca",
        file: "15_isolando_a_busca",
        description: "Migre a lógica da busca simples (Desafio 5) para dentro de uma função. Se encontrar o código, retorne o índice. Se o laço terminar e não encontrar, retorne -1.",
        hint: "Dar um 'retorne i' interrompe o laço imediatamente, o que otimiza a sua função!"
      },
      {
        part: 2,
        title: "Desafio 16: O Mais Barato",
        file: "16_o_mais_barato",
        description: "Crie uma função que receba dois preços numéricos (A e B). A função deve compará-los e retornar qual é o menor dos dois.",
        hint: "Isso ajuda a treinar a lógica base que usaremos para algoritmos de ordenação."
      },
      {
        part: 2,
        title: "Desafio 17: Troca de Posições",
        file: "17_troca_de_posicoes",
        description: "Dado um vetor com dois nomes invertidos, faça a troca dos valores nas posições sem perder o dado original.",
        hint: "É impossível trocar direto. Você precisa salvar o vetor[0] temporariamente numa variável auxiliar!"
      },
      {
        part: 2,
        title: "Desafio 18: Calculando a Média do Estoque",
        file: "18_media_do_estoque",
        description: "Função que recebe total financeiro e quantidade de produtos. Calcule a média, protegendo o código de divisões por zero.",
        hint: "Antes de dividir, verifique 'se (quantidade == 0)'. Se for, retorne 0.0."
      },
      {
        part: 2,
        title: "Desafio 19: Juntando as Peças",
        file: "19_busca_e_calculo",
        description: "Crie um programa que faça a busca e depois passe a quantidade e preço desse item encontrado para a função de cálculo financeiro.",
        hint: "Integração é a chave da SAP! Chame a função de busca e guarde o resultado numa variável de índice para acessar as outras tabelas."
      },
      {
        part: 2,
        title: "Desafio 20: O Menu Principal",
        file: "20_menu_principal",
        description: "Construa o esqueleto de menu das atividades. Uma estrutura 'enquanto' que chama uma função que desenha as opções e lê a resposta.",
        hint: "A estrutura while (opcao != sair) vai rodar tudo o que formos programar daqui pra frente."
      },

      // PARTE 3
      {
        part: 3,
        title: "Atividade 1: Cadastro e Consulta",
        file: "atividade_1_cadastro_consulta",
        description: "Gabarito: Implementação completa com vetores paralelos para controle de cadastro de produtos e a busca sequencial por código.",
        hint: "A função de busca é chamada na hora do cadastro para impedir que o sistema aceite códigos repetidos!"
      },
      {
        part: 3,
        title: "Atividade 2: Relatório e Ordenação",
        file: "atividade_2_relatorio_ordenacao",
        description: "Gabarito: Implementação completa das funções de valor total, alerta de produto zerado e ordenação via Bubble Sort em vetores paralelos.",
        hint: "Durante a ordenação, a regra fundamental é: ao inverter o vetor de quantidades, deve-se inverter códigos, nomes e preços simultaneamente!"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderCards(1, 'grid-part-1');
      renderCards(2, 'grid-part-2');
      renderCards(3, 'grid-part-3');
    });

    function renderCards(partNumber, containerId) {
      const container = document.getElementById(containerId);
      const filtered = exercises.filter(ex => ex.part === partNumber);
      
      filtered.forEach((ex, index) => {
        const card = document.createElement('div');
        card.className = "card p-6 flex flex-col justify-between cursor-pointer bg-white group";
        card.onclick = () => openDetails(ex);
        
        card.innerHTML = `
          <div>
            <p class="text-sm font-bold opacity-60 uppercase mb-2">Exercício ${index + 1}</p>
            <h3 class="text-xl font-bold leading-snug mb-4">${ex.title}</h3>
            <p class="text-sm line-clamp-3 mb-4">${ex.description}</p>
          </div>
          <div class="flex justify-between items-center border-t-2 border-transparent group-hover:border-white pt-4 mt-2 transition-all">
            <span class="font-mono text-sm opacity-80"><i class="fa-solid fa-file-code"></i> ${ex.file}.por</span>
            <i class="fa-solid fa-arrow-right icon-arrow transition-transform"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function openDetails(exercise) {
      document.getElementById('main-menu').classList.add('hidden');
      document.getElementById('details-view').classList.remove('hidden');
      window.scrollTo(0, 0);

      // Preenche os dados
      document.getElementById('detail-title').innerText = exercise.title;
      document.getElementById('detail-desc').innerText = exercise.description;
      document.getElementById('detail-hint').innerText = exercise.hint;
      document.getElementById('detail-filename').innerText = exercise.file;
      document.getElementById('detail-part-badge').innerText = `Parte ${exercise.part}`;
      
      const codeBlock = document.getElementById('detail-code');
      codeBlock.innerText = "Carregando código...";

      // Tentativa de Fetch do arquivo local (Tenta .por e .txt)
      const extension = '.por'; // Baseado no padrão do Portugol Studio
      
      try {
        const res = await fetch(exercise.file + extension);
        if (!res.ok) {
           throw new Error(`Status HTTP: ${res.status}`);
        }
        const text = await res.text();
        codeBlock.innerText = text;
      } catch (error) {
        // Exibindo EXATAMENTE a mensagem de erro solicitada
        codeBlock.innerText = `Código não pôde ser carregado. Como os arquivos estão salvos localmente na mesma pasta, lembre-se de usar um servidor local (ex: Live Server do VSCode) para que o navegador permita a leitura dos arquivos por questões de segurança (CORS). Arquivo esperado: ${exercise.file}${extension}`;
      }
    }

    function goBack() {
      document.getElementById('details-view').classList.add('hidden');
      document.getElementById('main-menu').classList.remove('hidden');
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
